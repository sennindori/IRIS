<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="12" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtler Glow for Lines -->
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Logo Font Gradient -->
    <linearGradient id="neonTextGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Standard Isometric Box Definition -->
    <g id="isoBox">
      <!-- Top Face -->
      <polygon points="0,-12 20,-22 40,-12 20,-2" fill="#38bdf8" />
      <!-- Left Face -->
      <polygon points="0,-12 20,-2 20,18 0,8" fill="#0284c7" />
      <!-- Right Face -->
      <polygon points="20,-2 40,-12 40,8 20,18" fill="#0369a1" />
      <!-- Barcode / White Label on Left Face -->
      <polygon points="3,2 10,-1 10,4 3,7" fill="#ffffff" opacity="0.85" />
    </g>

    <!-- Medium Highlighted Isometric Box -->
    <g id="isoBoxAlt">
      <polygon points="0,-12 20,-22 40,-12 20,-2" fill="#60a5fa" />
      <polygon points="0,-12 20,-2 20,18 0,8" fill="#2563eb" />
      <polygon points="20,-2 40,-12 40,8 20,18" fill="#1d4ed8" />
      <polygon points="3,2 10,-1 10,4 3,7" fill="#ffffff" opacity="0.85" />
    </g>
  </defs>

  <!-- Clip-path to make the SVG rounded-square like an app icon -->
  <clipPath id="iconClip">
    <rect x="0" y="0" width="512" height="512" rx="112" ry="112" />
  </clipPath>

  <!-- Main Container with App Icon clipping -->
  <g clip-path="url(#iconClip)">
    <!-- Base Background -->
    <rect width="512" height="512" fill="url(#bgGrad)" />

    <!-- Warehouse Structure: Back Grid Lines (Neon Purple/Blue) -->
    <path d="M 0 100 L 512 100 M 0 200 L 512 200 M 256 0 L 256 512" stroke="#4f46e5" stroke-width="1.5" opacity="0.15" />
    <path d="M 0 256 L 512 516 M 0 516 L 512 256" stroke="#c084fc" stroke-width="1" opacity="0.1" />

    <!-- Warehouse Pillars and Beams in background -->
    <g stroke="#1e293b" stroke-width="4" opacity="0.6">
      <line x1="60" y1="0" x2="60" y2="512" />
      <line x1="452" y1="0" x2="452" y2="512" />
      <line x1="256" y1="0" x2="256" y2="512" />
      <!-- Overhead Crane Rails -->
      <line x1="0" y1="80" x2="512" y2="80" stroke="#334155" stroke-width="8" />
      <line x1="0" y1="120" x2="512" y2="120" stroke="#334155" stroke-width="4" />
    </g>

    <!-- Neon Accent Lines on Columns -->
    <g stroke="#38bdf8" stroke-width="2" filter="url(#subtleGlow)" opacity="0.35">
      <line x1="58" y1="0" x2="58" y2="512" />
      <line x1="454" y1="0" x2="454" y2="512" />
    </g>
    <g stroke="#a855f7" stroke-width="2" filter="url(#subtleGlow)" opacity="0.35">
      <line x1="256" y1="0" x2="256" y2="512" />
    </g>

    <!-- WAREHOUSE SHELVING AND RACKS -->
    <!-- Left Rack -->
    <g transform="translate(40, 220)">
      <!-- Shelving structure metal uprights -->
      <path d="M0,0 L0,180 M60,-30 L60,150" stroke="#1e293b" stroke-width="5" />
      <!-- Shelf beams -->
      <path d="M0,30 L60,0 M0,90 L60,60 M0,150 L60,120" stroke="#334155" stroke-width="3" />
      <path d="M0,30 L60,0 M0,90 L60,60 M0,150 L60,120" stroke="#0ea5e9" stroke-width="1.5" filter="url(#subtleGlow)" opacity="0.5" />
      
      <!-- Stored boxes on Left Rack -->
      <!-- Bottom shelf -->
      <use href="#isoBox" x="5" y="115" />
      <use href="#isoBox" x="15" y="110" />
      <!-- Middle shelf -->
      <use href="#isoBoxAlt" x="5" y="55" />
      <use href="#isoBox" x="15" y="50" />
      <!-- Top shelf -->
      <use href="#isoBox" x="10" y="-5" />
    </g>

    <!-- Right Rack -->
    <g transform="translate(412, 220) scale(-1, 1)">
      <!-- Shelving structure metal uprights -->
      <path d="M0,0 L0,180 M60,-30 L60,150" stroke="#1e293b" stroke-width="5" />
      <!-- Shelf beams -->
      <path d="M0,30 L60,0 M0,90 L60,60 M0,150 L60,120" stroke="#334155" stroke-width="3" />
      <path d="M0,30 L60,0 M0,90 L60,60 M0,150 L60,120" stroke="#0ea5e9" stroke-width="1.5" filter="url(#subtleGlow)" opacity="0.5" />
      
      <!-- Stored boxes on Right Rack -->
      <!-- Bottom shelf -->
      <use href="#isoBox" x="5" y="115" />
      <use href="#isoBox" x="15" y="110" />
      <!-- Middle shelf -->
      <use href="#isoBox" x="5" y="55" />
      <use href="#isoBoxAlt" x="15" y="50" />
      <!-- Top shelf -->
      <use href="#isoBox" x="10" y="-5" />
    </g>

    <!-- Center Isometric Grid Stock Blocks (As in the image) -->
    <!-- Center Row Left -->
    <g transform="translate(140, 240)">
      <!-- Row 1 Back Deep -->
      <use href="#isoBox" x="40" y="-40" />
      <use href="#isoBox" x="80" y="-60" />
      <use href="#isoBoxAlt" x="120" y="-80" />

      <!-- Row 1 Back Middle -->
      <use href="#isoBoxAlt" x="40" y="-10" />
      <use href="#isoBox" x="80" y="-30" />
      <use href="#isoBox" x="120" y="-50" />
      <use href="#isoBox" x="160" y="-70" />

      <!-- Row 1 Front -->
      <use href="#isoBox" x="0" y="50" />
      <use href="#isoBox" x="40" y="30" />
      <use href="#isoBoxAlt" x="80" y="10" />
      <use href="#isoBox" x="120" y="-10" />
      <use href="#isoBox" x="160" y="-30" />

      <!-- Double Stacked boxes in Center Left -->
      <use href="#isoBox" x="40" y="-10" transform="translate(0, -20)" />
      <use href="#isoBoxAlt" x="80" y="10" transform="translate(0, -20)" />
      <use href="#isoBox" x="120" y="-10" transform="translate(0, -20)" />
    </g>

    <!-- Center Row Right -->
    <g transform="translate(260, 300)">
      <!-- Row 2 Back Deep -->
      <use href="#isoBox" x="40" y="-40" />
      <use href="#isoBoxAlt" x="80" y="-60" />
      <use href="#isoBox" x="120" y="-80" />

      <!-- Row 2 Back Middle -->
      <use href="#isoBox" x="0" y="-10" />
      <use href="#isoBox" x="40" y="-30" />
      <use href="#isoBox" x="80" y="-50" />
      <use href="#isoBoxAlt" x="120" y="-70" />

      <!-- Row 2 Front -->
      <use href="#isoBoxAlt" x="0" y="30" />
      <use href="#isoBox" x="40" y="10" />
      <use href="#isoBox" x="80" y="-10" />
      <use href="#isoBox" x="120" y="-30" />

      <!-- Double Stacked boxes in Center Right -->
      <use href="#isoBoxAlt" x="40" y="10" transform="translate(0, -20)" />
      <use href="#isoBox" x="80" y="-10" transform="translate(0, -20)" />
    </g>

    <!-- Yellow Floor Navigation Guide Stripes -->
    <path d="M 120 400 L 256 468 L 392 400" fill="none" stroke="#eab308" stroke-width="2.5" opacity="0.65" stroke-dasharray="8 4" />
    <path d="M 140 450 L 256 508 L 372 450" fill="none" stroke="#eab308" stroke-width="1.5" opacity="0.45" stroke-dasharray="6 3" />

    <!-- Overhead Warehouse Crane Hook details in top center -->
    <g stroke="#4f46e5" stroke-width="2" opacity="0.6">
      <line x1="256" y1="80" x2="256" y2="150" stroke="#334155" stroke-width="3" />
      <rect x="251" y="150" width="10" height="10" fill="#475569" stroke="none" />
      <path d="M 256 160 Q 252 165 256 170 Q 260 175 256 180" fill="none" stroke="#64748b" stroke-width="3" />
    </g>

    <!-- Cyber / Tech HUD Rings overlay in center -->
    <ellipse cx="256" cy="310" rx="160" ry="80" fill="none" stroke="#38bdf8" stroke-width="0.75" opacity="0.25" stroke-dasharray="10 15" />
    <ellipse cx="256" cy="310" rx="190" ry="95" fill="none" stroke="#a855f7" stroke-width="1.25" opacity="0.15" stroke-dasharray="40 100" />

    <!-- FUTURISTIC GLOWING "I.R.I.S." TEXT LOGO (Match Font and Glow as close as possible) -->
    <!-- Semi-transparent dark back drop behind Logo to improve text contrast -->
    <rect x="110" y="115" width="292" height="74" rx="22" fill="#020617" opacity="0.65" filter="url(#subtleGlow)" />
    <rect x="110" y="115" width="292" height="74" rx="22" fill="none" stroke="#3b82f6" stroke-width="1.5" opacity="0.4" />

    <!-- Cyan and purple back shadow for absolute intensity -->
    <text x="256" y="172"
          font-family="'Space Grotesk', 'Inter', 'SF Pro Display', system-ui, sans-serif" 
          font-weight="900" 
          font-style="normal"
          font-size="56px" 
          text-anchor="middle" 
          letter-spacing="0.08em" 
          fill="#c084fc" 
          filter="url(#neonGlow)" 
          opacity="0.95">I.R.I.S.</text>

    <!-- Main Front text layer -->
    <text x="256" y="172"
          font-family="'Space Grotesk', 'Inter', 'SF Pro Display', system-ui, sans-serif" 
          font-weight="900" 
          font-style="normal"
          font-size="56px" 
          text-anchor="middle" 
          letter-spacing="0.08em" 
          fill="url(#neonTextGrad)"
          stroke="#ffffff"
          stroke-width="1.25">I.R.I.S.</text>

    <!-- Little UI Corners in HUD panel style around logo -->
    <path d="M 115 130 L 115 120 L 125 120" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.8" />
    <path d="M 397 130 L 397 120 L 387 120" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.8" />
    <path d="M 115 174 L 115 184 L 125 184" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.8" />
    <path d="M 397 174 L 397 184 L 387 184" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.8" />
  </g>
</svg>
