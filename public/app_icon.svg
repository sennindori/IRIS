<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%">
  <!-- Round the corners using a clip-path -->
  <defs>
    <clipPath id="iconClip">
      <rect x="0" y="0" width="1024" height="1024" rx="224" ry="224" />
    </clipPath>
  </defs>
  <!-- Embeds the original high-resolution app_icon.png directly -->
  <image href="/app_icon.png" x="0" y="0" width="1024" height="1024" clip-path="url(#iconClip)" />
</svg>
